services:
  intelligent-exam-generator:
    build: .
    container_name: exam-generator-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=academic-rag-exam-secret-key-2026
      # - GEMINI_API_KEY=your_gemini_api_key_here
      # - OPENAI_API_KEY=your_openai_api_key_here
    volumes:
      - exam-data:/app/server/data
      - exam-uploads:/app/server/uploads
      - exam-exports:/app/server/exports
    restart: unless-stopped

volumes:
  exam-data:
  exam-uploads:
  exam-exports:
